<mat-sidenav-container class="sidenav-container">

  <mat-sidenav [opened]="sidenavOpen()" mode="side" class="sidenav">
    <div class="sidenav-header">
      <mat-icon class="app-icon">movie</mat-icon>
      <span class="app-title">CineApp</span>
    </div>

    <mat-nav-list>
      @for (item of visibleItems; track item.route) {
        <a mat-list-item
           [routerLink]="item.route"
           routerLinkActive="active-link"
           [routerLinkActiveOptions]="{ exact: false }">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="sidenav-footer">
      <div class="user-info">
        <mat-icon>account_circle</mat-icon>
        <div class="user-details">
          <span class="user-name">{{ auth.user()?.nombre_publico }}</span>
          <span class="user-role">{{ auth.user()?.rol }}</span>
        </div>
      </div>
      <button mat-icon-button (click)="logout()" matTooltip="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">CineApp</span>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
